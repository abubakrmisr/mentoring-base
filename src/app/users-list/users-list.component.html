<div class="form-conteiner">
  <app-creat-user-form (createUser)="createUser($event)"></app-creat-user-form>
</div>

<div class="ItemsGridPage">
  <div class="user-cards-conteiner">
    <div *ngFor="let user of users$ | async" class="user-cards">
      <app-user-card
        [user]="user"
        (deletUser)="deleteUser($event)"
      ></app-user-card>
    </div>
  </div>
</div>
