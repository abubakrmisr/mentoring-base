<div>
  <app-creat-user-dialog-launcher (createUser)="createUser($event)"></app-creat-user-dialog-launcher>
</div>

<div class="ItemsGridPage">
  <div class="user-cards-conteiner">
    <div *ngFor="let user of users$ | async">
      <app-user-card
        [user]="user"
        (deleteUser)="deleteUser($event)"
        (editUser)="editUser($event)"
      ></app-user-card>
    </div>
  </div>
</div>
