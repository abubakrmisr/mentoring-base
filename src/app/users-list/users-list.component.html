КОМПОНЕНТ СПИСКА ЮЗЕРОВ
<div style="display: flex; flex-wrap: wrap">
   <div *ngFor="let items of users"
      style="width: 200px; height: 200px; border: 1px solid black; margin: 10px; padding: 10px;">
      <p>{{items.name}}</p>
      <p>{{items.email}}</p>
      <p>{{items.website}}</p>
      <p>{{items.company.name}}</p>
      <button (click)="deleteUser(items.id)">УДАЛИТЬ ЮЗЕРА</button>
   </div>
</div>
