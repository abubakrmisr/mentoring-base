<h2 mat-dialog-title>Delete file</h2>
<mat-dialog-content>
  Would you like to delete {{ data.user.name }}?
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close>No</button>
  <button
    matButton
    mat-raised-button
    color="primary"
    [mat-dialog-close]="data.user.id"
    cdkFocusInitial
  >
    Ok
  </button>
</mat-dialog-actions>
