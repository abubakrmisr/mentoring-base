<h1>CREATE TODO</h1>
<div class="form-container">
  <form [formGroup]="form">
    <mat-form-field appearance="fill">
      <mat-label>TASK TEXT:</mat-label>
      <input
        matInput
        type="text"
        class="form-input"
        formControlName="title"
        required
      />
      <mat-error *ngIf="form.get('title')?.hasError('required')">
        Task is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>TASK AUTHOR:</mat-label>
      <input
        matInput
        type="text"
        class="form-input"
        formControlName="userId"
        required
      />
      <mat-error *ngIf="form.get('userId')?.hasError('required')">
        Author is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>TASK COMPLETED:</mat-label>

      <input
        matInput
        type="text"
        class="form-input"
        formControlName="completed"
        required
      />

      <mat-error *ngIf="form.get('completed')?.hasError('required')">
        Company Name is required
      </mat-error>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      class="form-button"
      type="submit"
      [disabled]="form.invalid"
      (click)="submitForm()"
    >
      CREATE TODO
    </button>
  </form>
</div>
