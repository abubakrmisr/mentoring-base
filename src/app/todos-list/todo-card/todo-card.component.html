<mat-card class="user-cards">
  <mat-card-title>
    <span>ТЕКСТ ЗАДАЧИ:</span>
    <p>{{ todo.title }}</p>
  </mat-card-title>

  <mat-card-content>
    <p><strong>АВТОР ЗАДАЧИ:</strong> {{ todo.userId }}</p>
    <p>
      <strong>ЗАДАЧА ЗАВЕРШЕНА:</strong> {{ todo.completed ? "ДА" : "НЕТ" }}
    </p>
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-raised-button
      color="warn"
      class="mat-card-button"
      (click)="openDeleteDialog()"
      aria-label="Удалить задачу"
    >
      <mat-icon>delete</mat-icon>
      Удалить задачу
    </button>

    <button
      mat-raised-button
      color="primary"
      class="mat-card-button"
      (click)="openDialog()"
      aria-label="Редактировать задачу"
    >
      <mat-icon>edit</mat-icon>
      Редактировать задачу
    </button>
  </mat-card-actions>
</mat-card>
