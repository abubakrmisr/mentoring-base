<div>
  <app-create-todo-dialog-launcher
    (createTodo)="createTodo($event)"
  ></app-create-todo-dialog-launcher>
</div>

<div class="ItemsGridPage">
  <div class="todo-cards-conteiner">
    <div *ngFor="let todo of todos$ | async">
      <app-todo-card
        [todo]="todo"
        (deleteTodo)="deleteTodo($event)"
        (editTodo)="editTodo($event)"
      ></app-todo-card>
    </div>
  </div>
</div>
